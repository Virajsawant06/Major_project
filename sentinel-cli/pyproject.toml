[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security"
version = "0.2.1"
description = "AI-powered ethical hacking and remediation CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sentinel Team", email = "hello@sentinel.dev" }
]
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
    "python-owasp-zap-v2.4>=0.0.20",
    "python-dotenv>=1.0.0",
    "python-nmap>=0.7.1",
    "sslyze>=5.0.0",
    "openai>=1.0.0",
    "prompt-toolkit>=3.0.0"
]

[project.scripts]
sentinel = "src.main:main"
