<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel — Navbar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0f1a;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      /* subtle background so glass effect is visible */
      background-image:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(99, 102, 241, 0.07) 0%, transparent 70%);
    }

    /* ── Navbar wrapper ── */
    .nav-outer {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 48px);
      max-width: 860px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px 10px 16px;
      border-radius: 999px;

      /* Glassmorphism */
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(56, 189, 248, 0.13);
      box-shadow:
        0 4px 32px rgba(0, 0, 0, 0.45),
        0 1px 0px rgba(255,255,255,0.04) inset,
        0 0 0 0.5px rgba(56,189,248,0.07) inset;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
    }

    .logo-text {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #f1f5f9;
      text-transform: uppercase;
    }

    /* ── Nav links ── */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 999px;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: #f1f5f9;
      background: rgba(255,255,255,0.06);
    }

    .nav-links a.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    /* ── Right actions ── */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-github {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 7px 15px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }

    .btn-github:hover {
      color: #f1f5f9;
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.09);
    }

    .btn-github svg {
      flex-shrink: 0;
    }

    .btn-cta {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.15s;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }

    .btn-cta:hover {
      opacity: 0.88;
      transform: scale(1.03);
    }

    /* ── Demo page content ── */
    .page-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(148,163,184,0.3);
      font-size: 14px;
      letter-spacing: 0.05em;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <nav class="nav-outer">
    <div class="navbar">

      <!-- Logo -->
      <a class="logo" href="#">
        <svg class="logo-icon" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="15,2 27,8.5 27,21.5 15,28 3,21.5 3,8.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
          <polygon points="15,7 23,11.5 23,20.5 15,25 7,20.5 7,11.5" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1"/>
        </svg>
        <span class="logo-text">Sentinel</span>
      </a>

      <!-- Nav links -->
      <ul class="nav-links">
        <li><a href="#">Process</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">Coverage</a></li>
        <li><a href="#" class="active">Install</a></li>
      </ul>

      <!-- Actions -->
      <div class="nav-actions">
        <a class="btn-github" href="#">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
          GitHub
        </a>
        <a class="btn-cta" href="#">Get Started</a>
      </div>

    </div>
  </nav>

  <div class="page-hint">← scroll to see floating effect →</div>

</body>
</html>
